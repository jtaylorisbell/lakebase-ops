# Databricks Apps runtime config.
#
# Migrations run on startup as the App service principal — the SP owns the
# resulting schema/tables, which is required by CAN_CONNECT_AND_CREATE.

command:
  - bash
  - -c
  - "uv run alembic upgrade head && uv run uvicorn app:app --host 0.0.0.0 --port 8000"

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: LAKEBASE_BRANCH_ID
    value: "production"
