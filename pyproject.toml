[project]
name = "todo-app"
version = "0.1.0"
description = "A To-Do list app powered by Databricks Apps and Lakebase Autoscaling"
readme = { text = "", content-type = "text/markdown" }
authors = [
    { name = "Taylor Isbell", email = "taylor.isbell@databricks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "databricks-sdk>=0.40",
    "python-dotenv>=1.0",
    "structlog>=25.5",
    "sqlalchemy>=2.0.45",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
