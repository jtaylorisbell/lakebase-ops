# Databricks Asset Bundle for the Lakebase Todo App.
#
# Deploy:  databricks bundle deploy -t {dev|prod}

bundle:
  name: lakebase-todo-app

include:
  - resources/*.yml

variables:
  owner_email:
    description: Workspace user granted CAN_MANAGE on the Lakebase project.
    default: taylor.isbell@databricks.com

  lakebase_project_id:
    description: Lakebase Autoscaling project ID. The Postgres resource binding and the app's runtime config both read from this.
    default: todo-app-v2

  lakebase_display_name:
    description: Human-readable name for the Lakebase project in the UI.
    default: Lakebase Todo App

  lakebase_pg_version:
    description: Postgres major version for Lakebase.
    default: "17"

  lakebase_branch:
    description: Lakebase branch the deployed app connects to at runtime.
    default: production

  lakebase_database_id:
    description: Platform-level database resource id under the Lakebase branch. Default is the auto-created database.
    default: databricks-postgres

  lakebase_schema:
    description: Postgres schema this app creates and owns inside the Lakebase database.
    default: todo_app

sync:
  exclude:
    - node_modules/
    - frontend/node_modules/
    - frontend/dist/
    - .venv/
    - __pycache__/
    - .env

targets:
  dev:
    default: true
    resources:
      postgres_projects:
        todo_app_project:
          permissions:
            - user_name: ${var.owner_email}
              level: CAN_MANAGE

  prod:
    mode: production
    resources:
      postgres_projects:
        todo_app_project:
          permissions:
            - user_name: ${var.owner_email}
              level: CAN_MANAGE
