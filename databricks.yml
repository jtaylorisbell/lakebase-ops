# Databricks Asset Bundle for the Lakebase Todo App.
#
# Deploy:  databricks bundle deploy -t {dev|prod}

bundle:
  name: lakebase-todo-app

include:
  - resources/*.yml

sync:
  exclude:
    - node_modules/
    - frontend/node_modules/
    - frontend/dist/
    - .venv/
    - __pycache__/
    - "*.egg-info/"
    - .env
    - .env.local

targets:
  dev:
    default: true
    resources:
      postgres_projects:
        todo_app_project:
          permissions:
            - user_name: taylor.isbell@databricks.com
              level: CAN_MANAGE

  prod:
    mode: production
    resources:
      postgres_projects:
        todo_app_project:
          permissions:
            - user_name: taylor.isbell@databricks.com
              level: CAN_MANAGE
