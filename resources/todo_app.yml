resources:
  apps:
    todo_app:
      name: lakebase-todo-app-${bundle.target}
      description: A To-Do list app powered by Databricks Apps and Lakebase Autoscaling
      source_code_path: ../

      # Inline runtime config — supersedes any app.yaml in the source tree.
      # Defining it here lets ${var.*} substitution flow from databricks.yml.
      config:
        command:
          - bash
          - -c
          - "uv run alembic upgrade head && uv run uvicorn app:app --host 0.0.0.0 --port 8000"
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_id}
          - name: LAKEBASE_BRANCH_ID
            value: ${var.lakebase_branch}

      # CAN_CONNECT_AND_CREATE lets the App SP connect to Postgres and create
      # its own schema/tables. The App SP only has read/write access to objects
      # it owns, so all schema/table creation lives in alembic migrations that
      # run at app startup.
      resources:
        # Reference the postgres_project resource by id (not via ${var.*}) so
        # Terraform infers a dependency from this app on the project. Without
        # the reference, both resources are created in parallel and the app
        # binding fails when the production branch isn't yet READY.
        - name: postgres
          postgres:
            branch: projects/${resources.postgres_projects.todo_app_project.project_id}/branches/${var.lakebase_branch}
            database: projects/${resources.postgres_projects.todo_app_project.project_id}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE
